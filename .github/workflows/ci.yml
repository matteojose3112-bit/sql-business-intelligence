name: SQL validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
      - name: Validate SQL schema, seed data, and analytics
        run: bash tests/test_sql.sh
